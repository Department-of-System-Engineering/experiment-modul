services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: experiment_modul
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # SQL files in docker-entrypoint-initdb.d are executed in alphabetical order on first startup
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    ports:
      - "5432:5432"
    networks:
      - shared-network # Shared network for inter-module communication

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db # Wait for the database to start before the backend
    networks:
      - shared-network # Same shared network as db and participant module
    environment:
      # These are read by database.py via os.getenv()
      POSTGRES_DB: experiment_modul
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db # Docker service name, not localhost
      POSTGRES_PORT: 5432

networks:
  shared-network:
    external: true # Created manually with: docker network create shared-network

volumes:
  postgres_data: # Persists database data between container restarts
